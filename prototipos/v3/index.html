<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Colibri · Feedback de clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Display:wght@500;600&family=Noto+Serif+Display:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="css/app.css?v=3.2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="brand">
      <img src="assets/colibri-logo.png" alt="Colibri">
      <span>Feedback de clientes</span>
    </div>

    <nav class="nav">
      <p class="nav-group">Análise</p>
      <a href="#/visao-geral" data-route="visao-geral"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Visão geral</a>
      <a href="#/areas" data-route="areas"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Áreas de serviço</a>
      <a href="#/fontes" data-route="fontes"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6M4.5 11.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/></svg>Fontes</a>

      <p class="nav-group">Operação</p>
      <a href="#/casos" data-route="casos"><svg viewBox="0 0 24 24"><path d="M3 13l2.5-8h13L21 13v6H3v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>Casos<span class="nav-count tnum" id="nav-count"></span></a>
    </nav>

    <div class="sidebar-foot">
      <p class="fict"><b>Dados fictícios.</b> Áreas, números e textos servem para discutir a interface e não representam a Colibri.</p>
      <div class="me"><span class="av av-3">CX</span><div><b>Equipa CX</b><span>Grupo Brisa</span></div></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="Localização"></nav>
    </header>

    <main id="page" tabindex="-1"></main>
  </div>
</div>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/dados-ficticios.js?v=3.2"></script>
<script src="js/app.js?v=3.2"></script>
</body>
</html>
